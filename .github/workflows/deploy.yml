name: Build and publish the web port

# Builds the Super Mario 64 web port (WebAssembly) and publishes the static site.
#
# Why this differs from a plain "make TARGET_WEB=1": the checkout of this repo is
# the n64decomp source tree, which has no web target and needs a baserom. The web
# port is built from sm64-port plus the clean-room asset generator, which
# regenerates every texture, glyph and sample from committed data — so this runs
# with no ROM and no secrets. All of that lives in web/tools/build_web.sh, which
# is pinned to exact upstream commits and can be run locally the same way.
#
# Publishing: the site is deployed to GitHub Pages. Pages on a *private* repo
# requires a paid GitHub plan; on a free plan the publish job will fail (the
# "Upload the site" artifact from the build job still works). A Pages site is
# public, so it is not gated by the sign-in layer the Worker adds. Set the repo
# variable PUBLISH_PAGES=false to skip publishing and keep only the artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebAssembly port
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned: the port patches target emscripten 6 API changes.
          version: 6.0.13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Cache Emscripten system libraries
        uses: actions/cache@v4
        with:
          path: ~/.cache/emscripten
          key: emcache-${{ runner.os }}-6.0.13-${{ hashFiles('web/tools/build_web.sh') }}
          restore-keys: |
            emcache-${{ runner.os }}-6.0.13-

      - name: Preflight diagnostics
        run: |
          set +e
          echo "=== PATH ===" > prefail.txt
          echo "$PATH" >> prefail.txt
          echo "=== which emcc ===" >> prefail.txt
          which emcc >> prefail.txt 2>&1 || echo "(no emcc on PATH)" >> prefail.txt
          echo "=== emcc --version (stdout) ===" >> prefail.txt
          emcc --version >> prefail.txt 2>&1 || true
          echo "=== emcc --version exit=$? ===" >> prefail.txt
          echo "=== command -v emcc ===" >> prefail.txt
          command -v emcc >> prefail.txt 2>&1 || echo "(command -v: no emcc)" >> prefail.txt
          echo "=== realpath present? ===" >> prefail.txt
          command -v realpath >> prefail.txt 2>&1 || echo "(no realpath)" >> prefail.txt
          echo "=== realpath -m dist (cwd=repo root) ===" >> prefail.txt
          (cd "$GITHUB_WORKSPACE" && realpath -m dist) >> prefail.txt 2>&1 || echo "(realpath -m dist failed)" >> prefail.txt
          echo "=== realpath -m web ===" >> prefail.txt
          (cd "$GITHUB_WORKSPACE" && realpath -m web) >> prefail.txt 2>&1 || echo "(realpath -m web failed)" >> prefail.txt
          echo "=== realpath -m WEB_DIR/.. ===" >> prefail.txt
          (cd "$GITHUB_WORKSPACE/web" && realpath -m "$(dirname "$(pwd -P)")") >> prefail.txt 2>&1 || echo "(failed)" >> prefail.txt
          echo "=== guard simulation for OUT=dist ===" >> prefail.txt
          OUT_ABS="$(cd "$GITHUB_WORKSPACE" && realpath -m dist)"
          WEB_DIR="$(cd "$GITHUB_WORKSPACE/web" && pwd -P)"
          REPO_DIR="$(cd "$GITHUB_WORKSPACE/web" && dirname "$(pwd -P)")"
          echo "OUT_ABS=$OUT_ABS" >> prefail.txt
          echo "WEB_DIR=$WEB_DIR" >> prefail.txt
          echo "REPO_DIR=$REPO_DIR" >> prefail.txt
          guard_ok=1
          for protected in "$WEB_DIR" "$REPO_DIR"; do
            case "$OUT_ABS" in
              "$protected") echo "GUARD REJECT (OUT==protected)" >> prefail.txt; guard_ok=0;;
            esac
            case "$protected" in
              "$OUT_ABS"/*) echo "GUARD REJECT (protected inside OUT)" >> prefail.txt; guard_ok=0;;
            esac
          done
          if [ "$guard_ok" = 1 ]; then echo "GUARD: would PASS (dist allowed)" >> prefail.txt; else echo "GUARD: would REJECT" >> prefail.txt; fi
          echo "=== preflight result ===" >> prefail.txt
          echo "OK" >> prefail.txt
          echo "=== prefail.txt written, publishing as artifact ==="
          cat prefail.txt
          ls -l prefail.txt
        shell: bash

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: prefail.txt
          retention-days: 14

      - name: Build (logged)
        env:
          EM_CACHE: ~/.cache/emscripten
          JOBS: 4
        run: |
          # Capture everything so a failure is debuggable even when live logs
          # are not reachable. `bash -x` traces each command.
          bash -x web/tools/build_web.sh dist > build.log 2>&1; echo "BUILD_EXIT=$?" >> build.log
          cat build.log
          exit $(tail -n 1 build.log | sed -n 's/BUILD_EXIT=//p')

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Smoke test in headless Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node web/tools/smoke_test.mjs dist

      - name: Upload the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: sm64-web
          path: dist
          retention-days: 14

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: sm64-web
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it has never been enabled. Needs a
          # plan that allows Pages for this repo's visibility.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
