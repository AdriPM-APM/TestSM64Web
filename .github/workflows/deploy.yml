name: Build and Deploy SM64 Web Port

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git python3 python3-pip libaudiofile-dev libglew-dev libsdl2-dev

      - name: Setup Emscripten SDK (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify Emscripten Setup
        run: emcc -v

      - name: Compile SM64 to WebAssembly
        run: |
          # Build target for web platform (adjust target flags if using a custom Makefile fork)
          make PLATFORM=web -j$(nproc) || make TARGET_WEB=1 -j$(nproc)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts for Deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/us_web' # Adjust this path if your build outputs to a different directory

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
