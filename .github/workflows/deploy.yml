name: Build and publish the web port

# Builds the Super Mario 64 web port (WebAssembly) and publishes the static site.
#
# Why this differs from a plain "make TARGET_WEB=1": the checkout of this repo is
# the n64decomp source tree, which has no web target and needs a baserom. The web
# port is built from sm64-port plus the clean-room asset generator, which
# regenerates every texture, glyph and sample from committed data — so this runs
# with no ROM and no secrets. All of that lives in web/tools/build_web.sh, which
# is pinned to exact upstream commits and can be run locally the same way.
#
# Publishing: the site is deployed to GitHub Pages. Pages on a *private* repo
# requires a paid GitHub plan; on a free plan the publish job will fail (the
# "Upload the site" artifact from the build job still works). A Pages site is
# public, so it is not gated by the sign-in layer the Worker adds. Set the repo
# variable PUBLISH_PAGES=false to skip publishing and keep only the artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebAssembly port
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned: the port patches target emscripten 6 API changes.
          version: 6.0.13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Cache Emscripten system libraries
        uses: actions/cache@v4
        with:
          path: ~/.cache/emscripten
          key: emcache-${{ runner.os }}-6.0.13-${{ hashFiles('web/tools/build_web.sh') }}
          restore-keys: |
            emcache-${{ runner.os }}-6.0.13-

      - name: Build
        env:
          EM_CACHE: ~/.cache/emscripten
          JOBS: 4
        run: bash web/tools/build_web.sh dist

      - name: Smoke test in headless Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node web/tools/smoke_test.mjs dist

      - name: Upload the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: sm64-web
          path: dist
          retention-days: 14

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: sm64-web
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it has never been enabled. Needs a
          # plan that allows Pages for this repo's visibility.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
